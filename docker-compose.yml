# UDP 遥测特征留样诊断台
# 联调程序向本机 9999/udp 发包 -> 服务编号并滚动保留最近 128 包；
# 网页（8080）登记十六进制载荷前缀 + 前后包数，首个匹配包触发自动留样，
# 收齐的样本可下载 JSON Lines；网页可触发本机发包演示。
services:
  sampler:
    build: ./app
    image: telemetry-sample-diag:latest
    container_name: telemetry-sample-diag
    ports:
      - "8080:8080"        # 诊断网页
      - "9999:9999/udp"    # 留样监听端口（联调程序向本机该端口发包）
    environment:
      UDP_PORT: "9999"     # 容器内监听端口；UDP_HOST 默认 0.0.0.0
    restart: unless-stopped
