<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>UDP 遥测缺号诊断台</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
         margin: 0; background: #f4f6f8; color: #1c2733; }
  header { background: #16324f; color: #fff; padding: 14px 22px; }
  header h1 { font-size: 18px; margin: 0; }
  header p { margin: 4px 0 0; font-size: 12px; opacity: .8; }
  main { max-width: 1080px; margin: 18px auto; padding: 0 16px; }
  .panel { background: #fff; border: 1px solid #dde3ea; border-radius: 8px;
           padding: 16px; margin-bottom: 16px; }
  .panel h2 { font-size: 15px; margin: 0 0 12px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
          gap: 10px 14px; }
  label { display: block; font-size: 12px; color: #5a6b7d; margin-bottom: 3px; }
  input { width: 100%; padding: 6px 8px; border: 1px solid #c4ced8;
          border-radius: 5px; font-size: 13px; }
  .btns { margin-top: 14px; display: flex; gap: 10px; flex-wrap: wrap; }
  button { padding: 8px 16px; border: 0; border-radius: 6px; font-size: 13px;
           cursor: pointer; background: #16324f; color: #fff; }
  button.demo { background: #0f7b6c; }
  button.ghost { background: #e3e9ef; color: #16324f; }
  button:hover { filter: brightness(1.1); }
  .card { background: #fff; border: 1px solid #dde3ea; border-left-width: 5px;
          border-radius: 8px; padding: 12px 16px; margin-bottom: 12px; }
  .card.RUNNING, .card.DRAINING { border-left-color: #3b82f6; }
  .card.overflow  { border-left-color: #dc2626; }
  .card.gap       { border-left-color: #d97706; }
  .card.clean     { border-left-color: #16a34a; }
  .card.weak      { border-left-color: #6b7280; }
  .card.ERROR     { border-left-color: #7c3aed; }
  .card h3 { font-size: 14px; margin: 0 0 6px; display: flex; gap: 8px;
             align-items: baseline; flex-wrap: wrap; }
  .tag { font-size: 11px; padding: 1px 8px; border-radius: 10px;
         background: #eef2f6; color: #40536a; }
  .kv { display: flex; flex-wrap: wrap; gap: 4px 18px; font-size: 12.5px;
        color: #37485c; margin: 6px 0; }
  .kv b { color: #16324f; }
  .verdict { font-size: 13.5px; font-weight: 600; margin-top: 6px; }
  .verdict.overflow { color: #dc2626; }
  .verdict.gap      { color: #d97706; }
  .verdict.clean    { color: #16a34a; }
  .verdict.weak     { color: #6b7280; }
  .missing { font-family: ui-monospace, Consolas, monospace; font-size: 11.5px;
             background: #f6f8fa; border: 1px solid #e3e9ef; border-radius: 5px;
             padding: 6px 8px; margin-top: 6px; word-break: break-all;
             max-height: 90px; overflow: auto; }
  .err { color: #7c3aed; font-size: 12px; }
  #toast { position: fixed; right: 16px; bottom: 16px; background: #16324f;
           color: #fff; padding: 10px 16px; border-radius: 6px; font-size: 13px;
           display: none; }
</style>
</head>
<body>
<header>
  <h1>UDP 遥测缺号诊断台</h1>
  <p>本地发包端 → 本机 Linux 接收端：每轮独立套接字，收尾读取该轮内核丢包计数（/proc/net/udp 的 drops 列），多轮并发分别统计</p>
</header>
<main>
  <div class="panel">
    <h2>发起一轮诊断</h2>
    <div class="grid">
      <div><label>包数 total</label><input id="total" type="number" value="2000"></div>
      <div><label>包长 payload(字节)</label><input id="payload" type="number" value="512"></div>
      <div><label>发送间隔 send_interval_ms</label><input id="send_interval_ms" type="number" value="0" step="0.1"></div>
      <div><label>接收暂缓 recv_pause_ms</label><input id="recv_pause_ms" type="number" value="0"></div>
      <div><label>每包处理 recv_delay_ms</label><input id="recv_delay_ms" type="number" value="0" step="0.1"></div>
      <div><label>收尾收包 grace_ms</label><input id="grace_ms" type="number" value="800"></div>
      <div><label>接收缓冲 rcvbuf(字节)</label><input id="rcvbuf" type="number" value="1048576"></div>
      <div><label>发送跳号 skip（如 10,20,30-40）</label><input id="skip" type="text" placeholder="留空表示不跳号"></div>
    </div>
    <div class="btns">
      <button onclick="startRound()">开始一轮</button>
      <button class="demo" onclick="startDemo()">并发演示：接收暂缓 + 发送跳号（两轮同跑）</button>
      <button class="ghost" onclick="clearRounds()">清空已结束</button>
    </div>
  </div>

  <div class="panel">
    <h2>诊断轮次（每秒自动刷新）</h2>
    <div id="rounds"><p style="color:#7a8a9b;font-size:13px">暂无轮次</p></div>
  </div>
</main>
<div id="toast"></div>
<script>
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.display = 'block';
  setTimeout(() => t.style.display = 'none', 3000);
}

function num(id) { return document.getElementById(id).value; }

async function startRound() {
  const body = {
    total: +num('total'), payload: +num('payload'),
    send_interval_ms: +num('send_interval_ms'),
    recv_pause_ms: +num('recv_pause_ms'),
    recv_delay_ms: +num('recv_delay_ms'),
    grace_ms: +num('grace_ms'), rcvbuf: +num('rcvbuf'),
    skip: document.getElementById('skip').value.trim()
  };
  const r = await fetch('/api/rounds', {method: 'POST',
    headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)});
  const j = await r.json();
  if (!r.ok) { toast('参数错误：' + j.error); return; }
  toast('已开跑：轮次 ' + j.id);
  refresh();
}

async function startDemo() {
  const r = await fetch('/api/demo', {method: 'POST'});
  const j = await r.json();
  toast('并发演示已开跑：暂缓轮 ' + j.pause_round + ' / 跳号轮 ' + j.skip_round);
  refresh();
}

async function clearRounds() {
  const r = await fetch('/api/rounds', {method: 'DELETE'});
  const j = await r.json();
  toast('已清空 ' + j.cleared + ' 轮');
  refresh();
}

function classify(r) {
  if (r.state === 'ERROR') return 'ERROR';
  if (r.state !== 'DONE') return r.state;
  if (r.drops === null) return 'weak';
  if (r.drops > 0) return 'overflow';
  if (r.missing_count > 0) return 'gap';
  return 'clean';
}

function card(r) {
  const cls = classify(r);
  const p = r.params;
  let html = `<div class="card ${cls}"><h3>轮次 ${r.id}
    <span class="tag">${r.state}</span>
    <span class="tag">端口 ${r.port ?? '-'}</span>
    <span class="tag">rcvbuf 生效 ${r.rcvbuf_effective ?? '-'}</span>
    <span class="tag">${r.created_at}</span></h3>
    <div class="kv">
      <span>编号空间 <b>0..${p.total - 1}</b></span>
      <span>已发 <b>${r.sent}</b></span>
      <span>已收 <b>${r.received}</b></span>
      <span>缺号 <b>${r.missing_count ?? '统计中'}</b></span>
      <span>内核丢包计数 <b>${r.drops === null ? '未取得' : r.drops}</b></span>
      <span>发送跳号 <b>${p.skip_count}</b></span>
      <span>接收暂缓 <b>${p.recv_pause_ms}ms</b></span>
      <span>每包处理 <b>${p.recv_delay_ms}ms</b></span>
    </div>`;
  if (r.verdict) html += `<div class="verdict ${cls}">结论：${r.verdict}</div>`;
  if (r.error) html += `<div class="err">注意：${r.error}</div>`;
  if (r.state === 'DONE')
    html += `<div class="btns" style="margin-top:8px">
      <button class="ghost" onclick="toggleMissing('${r.id}')">缺号明细</button></div>
      <div class="missing" id="missing-${r.id}" style="display:none"></div>`;
  return html + '</div>';
}

async function toggleMissing(id) {
  const el = document.getElementById('missing-' + id);
  if (el.style.display === 'none') {
    const r = await fetch('/api/rounds/' + id);
    const j = await r.json();
    el.textContent = (j.missing_preview && j.missing_preview.length)
      ? '缺号（前 ' + j.missing_preview.length + ' 条）：' + j.missing_preview.join(', ')
      : '无缺号';
    el.style.display = 'block';
  } else {
    el.style.display = 'none';
  }
}

async function refresh() {
  const r = await fetch('/api/rounds');
  const list = await r.json();
  const box = document.getElementById('rounds');
  box.innerHTML = list.length
    ? list.map(card).join('')
    : '<p style="color:#7a8a9b;font-size:13px">暂无轮次</p>';
}
setInterval(refresh, 1000);
refresh();
</script>
</body>
</html>
